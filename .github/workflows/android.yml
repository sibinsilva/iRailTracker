name: Android build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: iRailTracker/iRailTracker.csproj
  TFM: net10.0-android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # only used to publish a GitHub Release on v* tags

    steps:
      - name: Checkout (full history for git-based versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK dependencies
        run: >
          dotnet build "$PROJECT" -f "$TFM"
          -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSdkLicenses=True

      - name: Run unit tests
        run: dotnet test iRailTracker.UnitTests/iRailTracker.UnitTests.csproj -c Debug

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing secrets available (e.g. fork PR); building with the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          # Passed via env: so the passwords never appear on the command line or in logs
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: >
          dotnet publish "$PROJECT" -f "$TFM" -c Release -o out
          -p:ConfirmMajorBump=true
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.p12"
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASS
          -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASS

      - name: Build debug-signed release APK
        if: steps.keystore.outputs.signed != 'true'
        run: dotnet publish "$PROJECT" -f "$TFM" -c Release -o out -p:ConfirmMajorBump=true

      - name: Build signed Play Store bundle (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: >
          dotnet publish "$PROJECT" -f "$TFM" -c Release -o out-aab
          -p:ConfirmMajorBump=true
          -p:AndroidPackageFormat=aab
          -p:BuildPlayBundle=true
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.p12"
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASS
          -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASS

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Collect APK
        id: apk
        run: |
          apk=$(ls out/*-Signed.apk | head -n1)
          ver=$(git describe --tags --always)
          name="iRailTracker-${ver}.apk"
          cp "$apk" "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"
          echo "Built $name"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iRailTracker-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          aab=$(ls out-aab/*-Signed.aab | head -n1)
          cp "$aab" "iRailTracker-${GITHUB_REF_NAME}.aab"
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" "iRailTracker-${GITHUB_REF_NAME}.aab" \
            --title "$GITHUB_REF_NAME" --generate-notes

      # Optional: upload to the Play Console internal testing track. Inactive until a
      # PLAY_SERVICE_ACCOUNT_JSON secret exists (a Play Console service account key).
      - name: Check for Play Console credentials
        id: play
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "enabled=$([ -n "$PLAY_JSON" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload to Play Console (internal track)
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.app.irailtracker
          releaseFiles: iRailTracker-${{ github.ref_name }}.aab
          track: internal
          status: completed
